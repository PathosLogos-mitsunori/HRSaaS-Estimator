name: Publish calculator

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare files
        run: |
          mkdir -p _site
          cp -R public/. _site/
          cp _site/calculator.html _site/index.html
          echo '.consult-cta,#consult,footer a[href="/admin"]{display:none!important}' >> _site/styles.css
          sed -i 's/無料版の試算結果から相談を申し込めます。申込内容の精査後、担当者が連絡します。/相談申込は現在準備中です。/g' _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
